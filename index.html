<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRL Weather Overlay</title>
<style>
  :root {
    --text: #ffffff;
    --panel: rgba(10, 14, 20, .72);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: var(--text);
  }
  /* OIKEA ALAKULMA: flex-end + flex-end */
  body { display: flex; align-items: flex-end; justify-content: flex-end; padding: 12px; }

  .overlay {
    display: inline-flex; align-items: center; gap: 14px;
    max-width: calc(100vw - 24px);
    padding: 8px 16px;
    border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    white-space: nowrap;
    font-size: 20px; font-weight: 600;
  }
  .flag { width: 30px; height: 21px; border-radius: 3px; object-fit: cover; flex: none; display: block; }
  .flag-emoji { font-size: 24px; line-height: 1; display: none; }
  .place { overflow: hidden; text-overflow: ellipsis; }
  .temp { font-weight: 700; }
  .icon { font-size: 30px; line-height: 1; }
  .time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .error { color: #ffd2a8; font-size: 14px; }

  @media (max-width: 400px) {
    .overlay { gap: 8px; padding: 6px 10px; font-size: 14px; }
    .flag { width: 22px; height: 15px; }
    .icon { font-size: 22px; }
  }
</style>
</head>
<body>
  <main class="overlay" role="status" aria-live="polite">
    <img class="flag" id="flag" alt="" style="display:none">
    <span class="flag-emoji" id="flagEmoji"></span>
    <span class="place" id="place">Haetaan sijaintia…</span>
    <span class="temp" id="temp">--°C</span>
    <span class="icon" id="icon">🌤️</span>
    <span class="time" id="time">--.--</span>
  </main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const refreshMinutes = Math.max(5, Number(params.get('refresh') || 10));
  let lastCoords = null;
  let lastPlaceKey = null;   // viimeisin paikkakunta + maa
  let lastCheckTime = 0;     // milloin paikkakunta tarkistettiin viimeksi
  let lastCheckCoords = null;
  let tz = undefined; // paikallinen aikavyöhyke säädatasta

  const weatherIcon = code => {
    if (code === 0) return '☀️';
    if (code === 1) return '🌤️';
    if (code === 2) return '⛅';
    if (code === 3) return '☁️';
    if ([45,48].includes(code)) return '🌫️';
    if ([51,53,55,56,57].includes(code)) return '🌦️';
    if ([61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
    if ([71,73,75,77,85,86].includes(code)) return '🌨️';
    if ([95,96,99].includes(code)) return '⛈️';
    return '🌡️';
  };

  const countryName = cc => {
    try { return new Intl.DisplayNames(['fi'], {type: 'region'}).of(cc); }
    catch { return ''; }
  };

  const emojiFlag = cc =>
    cc.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));

  function setFlag(cc) {
    const img = $('flag'), em = $('flagEmoji');
    if (!cc) { img.style.display = 'none'; em.style.display = 'none'; return; }
    img.onerror = () => {
      img.style.display = 'none';
      em.textContent = emojiFlag(cc);
      em.style.display = 'block';
    };
    img.onload = () => { img.style.display = 'block'; em.style.display = 'none'; };
    img.src = `https://flagcdn.com/w80/${cc.toLowerCase()}.png`;
  }

  async function getPlace(lat, lon) {
    try {
      const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fi`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('geocode');
      const d = await r.json();
      const city = d.city || d.locality || d.localityInfo?.administrative?.[0]?.name ||
                   d.principalSubdivision || 'Nykyinen sijainti';
      return { city, cc: d.countryCode || '' };
    } catch {
      return { city: 'Nykyinen sijainti', cc: '' };
    }
  }

  async function getWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('weather');
    return r.json();
  }

  async function updateAt(lat, lon) {
    lastCoords = {lat, lon};
    try {
      const [place, weather] = await Promise.all([getPlace(lat, lon), getWeather(lat, lon)]);
      const cur = weather.current;
      tz = weather.timezone;
      lastPlaceKey = `${place.city}|${place.cc}`;
      const country = place.cc ? countryName(place.cc) : '';
      $('place').textContent = country ? `${place.city}, ${country}` : place.city;
      $('place').classList.remove('error');
      $('icon').textContent = weatherIcon(Number(cur.weather_code));
      $('temp').textContent = `${Number(cur.temperature_2m).toFixed(1).replace('.', ',')} °C`;
      setFlag(place.cc);
      tick();
    } catch {
      $('place').textContent = 'Säätietojen haku epäonnistui';
      $('place').classList.add('error');
    }
  }

  // Kellonaika paikallisessa ajassa (esim. 13.28)
  function tick() {
    $('time').textContent = new Intl.DateTimeFormat('fi-FI', {
      hour: '2-digit', minute: '2-digit', timeZone: tz
    }).format(new Date());
  }
  tick();
  setInterval(tick, 5000);

  function locate() {
    if (!('geolocation' in navigator)) {
      $('place').textContent = 'GPS ei ole käytettävissä';
      $('place').classList.add('error');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => updateAt(pos.coords.latitude, pos.coords.longitude),
      () => {
        $('place').textContent = 'Sijaintilupa tarvitaan';
        $('place').classList.add('error');
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 120000 }
    );
  }

  locate();
  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(
      async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (!lastCoords || Math.abs(lat - lastCoords.lat) > 0.015 ||
            Math.abs(lon - lastCoords.lon) > 0.015) {
          updateAt(lat, lon);
          return;
        }
        // Tarkista paikkakunta: väh. 30 s välein ja vain jos liikuttu ~300 m
        const now = Date.now();
        const moved = !lastCheckCoords ||
          Math.abs(lat - lastCheckCoords.lat) > 0.003 ||
          Math.abs(lon - lastCheckCoords.lon) > 0.003;
        if (now - lastCheckTime > 30000 && moved) {
          lastCheckTime = now;
          lastCheckCoords = {lat, lon};
          const p = await getPlace(lat, lon);
          if (`${p.city}|${p.cc}` !== lastPlaceKey) updateAt(lat, lon);
        }
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 120000, timeout: 20000 }
    );
  }
  setInterval(() => {
    if (lastCoords) updateAt(lastCoords.lat, lastCoords.lon);
    else locate();
  }, refreshMinutes * 60 * 1000);
})();
</script>
</body>
</html>
